# Test-time caps doubled provisionally at the user's request, 10-22.
# Slow periods are doubled; terminate-after counts stay fixed, so termination
# deadlines double as well.
# The two test suites (docs/foundation/testing-strategy.md, section 8): the
# focused one, every test but the fuzzy ones, within 30 seconds; and the fuzzy
# one, the test binaries named fuzzy_* beside the focused tests of each crate
# under tests/, within two minutes. A suite past its budget fails, naming the
# tests it stopped; a test past its slow period is flagged SLOW as it runs.

[profile.default]
default-filter = "not binary(/^fuzzy_/) and not binary(/^browser_/) and not binary(=live) and not binary(/^exhaustive_/) and not binary(/^qa_/)"
global-timeout = "30s"
slow-timeout = { period = "6s" }

# The tests under tests/ first, the longest, then the many short step tests
# behind them, so that the run ends close to its total over the threads.
[[profile.default.overrides]]
filter = "kind(test)"
priority = 10

# The focused suite on the macos-26 runner alone, set by the user's decision
# through director 803: a budget of its own, from measured figures; Linux's
# stays 30 seconds. It inherits the default profile's filter and overrides.
# Measured in macOS run 40019066645: 6020 tests in a 42.386 s wall, times
# 1.5, rounded up; the slow period is 6 s scaled by that run's time a test
# against Linux's (126.2 s over 6020 tests against 66.1 s over 6123, 1.94).
[profile.macos]
inherits = "default"
global-timeout = "64s"
slow-timeout = { period = "12s" }

[profile.fuzzy]
default-filter = "binary(/^fuzzy_/)"
global-timeout = "120s"
slow-timeout = { period = "40s" }

# Every TLS byte with real handshakes; run outside the gate after each push.
[profile.exhaustive]
default-filter = "binary(/^exhaustive_/)"
global-timeout = "120s"
slow-timeout = { period = "40s" }

# Real Chromium over io's process pipes and the ring. A missing browser or
# unavailable ring is a failure in this suite, not a skip.
[profile.browser]
default-filter = "(package(skein-browser-world) or package(skein-ui-web-tests) or package(skein-lab-browser)) and binary(/^browser_/)"
global-timeout = "4m"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1

# Measuring, not gating: no budget. With -j 1, each test's own time:
#   cargo nextest run --workspace --profile measure -j 1
#   cargo nextest run --workspace --profile measure -j 1 --ignore-default-filter -E 'binary(/^fuzzy_/)'
[profile.measure]
global-timeout = "2h"
slow-timeout = { period = "120s" }

# Real subscription endpoints; requires SKEIN_TEST_LIVE_* OAuth credentials.
# Keep network latency and subscription usage out of the offline suites.
[profile.live]
default-filter = "package(skein-llm-world) and binary(=live)"
global-timeout = "20m"
slow-timeout = { period = "120s", terminate-after = 3 }
test-threads = 1
retries = 0
fail-fast = false

# The QA passes' tests (docs/foundation/owners.md, 4.6): the binaries named qa_*, which the gate builds and does not run. One at a time: they run real Chromium.
[profile.qa]
default-filter = "binary(/^qa_/)"
global-timeout = "4m"
slow-timeout = { period = "40s", terminate-after = 3 }
test-threads = 1
