# skein's suites on macOS (temper's draft macos.md, 5.1): what
# scripts/check.sh runs, where it applies to macOS, on Apple Silicon.
# Left out: the Python lab (draft 5.2: Linux's), and the source scans
# (check-contracts, recovery-shape, taste.sh), which read the tree alone,
# answer as on Linux, and hold before every landing in the gate.
# A red run blocks nothing; it goes to the director (draft 5.1).
name: macos

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time on main; a push while one runs waits, and a later push
# takes the waiting one's place.
concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.95"
  NEXTEST_VERSION: 0.9.148
  NEXTEST_SHA256: 6c23b7fb4ca82c571fc8dfedbab45bfa773d45918f933170c85d21cd7f4b852b
  CHROME_VERSION: 147.0.7727.101
  CHROME_SHA256: de197188cf1b928e43d87145155f329bc4239087a86468e2546df9c2577a9515
  DEJAVU_SHA256: fa9ca4d13871dd122f61258a80d01751d603b4d3ee14095d65453b4e846e17d7
  CARGO_TERM_COLOR: never
  CARGO_INCREMENTAL: "0"
  # The runner's disk is small (14 GB documented): line tables keep
  # backtraces' places at a fraction of full debug information's size.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_PROFILE_TEST_DEBUG: line-tables-only
  # testing-strategy.md, section 8: nextest starts each test directly.
  NEXTEST_DOUBLE_SPAWN: "0"

jobs:
  suites:
    runs-on: macos-26
    timeout-minutes: 120
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      # Each check runs through $RUNNER_TEMP/run, which keeps its output and,
      # when it fails, gives as error annotations its failing tests, each
      # with its panic, error or signal, or the compiler's messages, and the
      # output's end, so that a failure reads through the public API without
      # the logs, which need a token.
      # Every check runs once the tools are in, whatever an earlier one
      # gave, and each suite runs to its end, so that one run shows every
      # failure.
      - name: The runner of each check
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          cat >"$RUNNER_TEMP/annotate.py" <<'EOF'
          import re, sys
          name, path = sys.argv[1:]
          lines = open(path, encoding="utf-8", errors="replace").read().splitlines()
          # GitHub keeps 4096 characters of each annotation and ten of a step's errors.
          SIZE, MOST = 4000, 9
          def escape(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
          def error(title, body):
              title = escape(title).replace(":", "%3A").replace(",", "%2C")
              print(f"::error title={title}::{escape(body[:SIZE])}")
          def chunks(entries):
              out, chunk = [], ""
              for entry in entries:
                  if chunk and len(chunk) + len(entry) + 1 > SIZE:
                      out.append(chunk)
                      chunk = ""
                  chunk += entry[:SIZE] + "\n"
              return out + [chunk] if chunk else out
          STATUS = re.compile(r"\s+([A-Z][A-Z-]+)\s+\[\s*[\d.]+s\]\s+(?:\(\s*\d+/\d+\)\s+)?(\S+)\s+(.+)$")
          FAILED = {"FAIL", "SIGSEGV", "SIGABRT", "SIGKILL", "SIGBUS", "SIGTERM", "TIMEOUT", "LEAK-FAIL", "ABORT"}
          BOILER = re.compile(r"(running \d+ tests?|test .* \.\.\. FAILED|failures:|test result: .*|note: run with .*|stdout ─+|stderr ─+|\S+)$")
          # Each failed test with what its output says of why: the panic and the lines
          # after it, an Error or a signal, or else the output's last lines.
          failures, current, end = {}, None, len(lines)
          for number, line in enumerate(lines):
              match = STATUS.match(line)
              if line.startswith("─") or line.strip().startswith("Summary ["):
                  current = None
                  if line.strip().startswith("Summary ["):
                      end = number
                      break
                  continue
              if match:
                  current = None
                  if match.group(1) in FAILED:
                      key = f"{match.group(1)} {match.group(2)} {match.group(3)}"
                      current = failures.setdefault(key, [])
                  continue
              if current is not None:
                  current.append(line.strip())
          def why(block):
              kept, taking = [], 0
              for line in block:
                  if "panicked at" in line or line.startswith(("Error:", "(test ")) or "error:" in line.lower()[:12]:
                      taking = 8
                  if taking and line and not line.startswith("note: run with"):
                      kept.append(line)
                      taking -= 1
                  elif not line:
                      taking = 0
              if not kept:
                  kept = [l for l in block if l and not BOILER.fullmatch(l)][-6:]
              kept = [l[:300] for l in kept]
              # A panic quoted inside a longer line, as a child's report carries it.
              for line in block:
                  for match in re.finditer("panicked at", line):
                      if match.start() > 40:
                          kept.append("... " + line[match.start():match.start() + 300])
              return "\n".join(dict.fromkeys(kept))[:1200]
          if failures:
              names = {}
              for key in failures:
                  status, binary, test = key.split(" ", 2)
                  names.setdefault(binary, []).append(test if status == "FAIL" else f"{test} ({status})")
              listing = [f"{binary}: " + ", ".join(tests) for binary, tests in names.items()]
              reasons = {}
              for key, block in failures.items():
                  reasons.setdefault(why(block), []).append(key)
              details = [("\n".join(keys) if len(keys) <= 3 else "\n".join(keys[:3]) + f"\n... and {len(keys) - 3} more")
                         + "\n  " + reason.replace("\n", "\n  ") for reason, keys in reasons.items()]
              found = chunks(listing)[:2] + chunks(details)
              title = f"{name}: {len(failures)} failed"
          else:
              found = []
              for number, line in enumerate(lines):
                  if re.match(r"(error(\[E\d+\])?|warning): ", line):
                      found.append("\n".join(lines[number:number + 4]))
              title = f"{name}: {len(dict.fromkeys(found))} compiler messages" if found else f"{name}: failed"
              found = chunks(dict.fromkeys(found))
          # The summary's counts, and what the run said of its budget and its end.
          said = [l.strip() for l in lines[:end] if re.search(r"timeout|timed out|cancell", l, re.I) and not STATUS.match(l)]
          tail = "\n".join(lines[end:end + 1] + said[:10] + [l for l in lines[end + 1:] if l.strip() and not STATUS.match(l)])[-SIZE:]
          for index, body in enumerate(found[:MOST - 1], 1):
              error(f"{title} {index}/{min(len(found), MOST - 1)}", body)
          error(f"{name}: the output's end", tail or "\n".join(lines[-40:]))
          EOF
          cat >"$RUNNER_TEMP/run" <<'EOF'
          #!/bin/bash
          # run NAME COMMAND...
          name=$1
          shift
          log="$RUNNER_TEMP/logs/$name.log"
          "$@" 2>&1 | tee "$log"
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
              python3 -I "$RUNNER_TEMP/annotate.py" "$name" "$log"
          fi
          exit "$status"
          EOF
          chmod +x "$RUNNER_TEMP/run"
          echo "RUN=$RUNNER_TEMP/run" >>"$GITHUB_ENV"

      - name: Rust at the workspace's rust-version, and cargo-nextest
        id: rust
        run: |
          # rustup is on the image; no installer script runs here.
          if ! command -v rustup >/dev/null; then
              echo "::error title=rustup::rustup is not on the macos-26 image"
              exit 1
          fi
          rustup toolchain install "$RUST_VERSION" --profile minimal \
              --component clippy,rustfmt --target wasm32-unknown-unknown
          rustup default "$RUST_VERSION"
          curl -sSfL -o "$RUNNER_TEMP/nextest.tar.gz" \
              "https://github.com/nextest-rs/nextest/releases/download/cargo-nextest-$NEXTEST_VERSION/cargo-nextest-$NEXTEST_VERSION-universal-apple-darwin.tar.gz"
          echo "$NEXTEST_SHA256  $RUNNER_TEMP/nextest.tar.gz" | shasum -a 256 -c -
          mkdir -p "$HOME/.cargo/bin"
          tar -xzf "$RUNNER_TEMP/nextest.tar.gz" -C "$HOME/.cargo/bin"
          rustc --version
          cargo nextest --version
          uname -a

      - name: Chrome for Testing
        id: chrome
        run: |
          curl -sSfL -o "$RUNNER_TEMP/chrome.zip" \
              "https://storage.googleapis.com/chrome-for-testing-public/$CHROME_VERSION/mac-arm64/chrome-mac-arm64.zip"
          echo "$CHROME_SHA256  $RUNNER_TEMP/chrome.zip" | shasum -a 256 -c -
          unzip -q "$RUNNER_TEMP/chrome.zip" -d "$RUNNER_TEMP/chrome"
          chrome="$RUNNER_TEMP/chrome/chrome-mac-arm64/Google Chrome for Testing.app/Contents/MacOS/Google Chrome for Testing"
          test -x "$chrome"
          echo "SKEIN_TEST_CHROMIUM=$chrome" >>"$GITHUB_ENV"

      # The browser tier's fonts, as Debian's fonts-dejavu-core gives them on
      # Linux: in the user's fonts, where Chromium on macOS finds them through
      # CoreText, as a platform font rather than a page's.
      - name: DejaVu fonts
        id: fonts
        run: |
          curl -sSfL -o "$RUNNER_TEMP/dejavu.tar.bz2" \
              https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
          echo "$DEJAVU_SHA256  $RUNNER_TEMP/dejavu.tar.bz2" | shasum -a 256 -c -
          tar -xjf "$RUNNER_TEMP/dejavu.tar.bz2" -C "$RUNNER_TEMP"
          test -f "$RUNNER_TEMP/dejavu-fonts-ttf-2.37/ttf/DejaVuSans.ttf"
          mkdir -p "$HOME/Library/Fonts"
          cp "$RUNNER_TEMP/dejavu-fonts-ttf-2.37/ttf/"*.ttf "$HOME/Library/Fonts/"
          echo "SKEIN_TEST_FONTS=$RUNNER_TEMP/dejavu-fonts-ttf-2.37/ttf" >>"$GITHUB_ENV"

      # The registry by the lock; the target by the lock and the toolchain,
      # saved once per key: the dependencies stay built, and the workspace's
      # own crates build again in each run.
      - name: Restore the registry
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-macos-26-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-home-macos-26-
      - name: Restore the target
        id: target
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: target-macos-26-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: target-macos-26-rust-${{ env.RUST_VERSION }}-

      - name: Formatting
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN fmt cargo fmt --all --check

      - name: Clippy over every target of the whole workspace
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN clippy cargo clippy --workspace --all-targets -- -D warnings

      - name: The portable libraries and the browser-only halves on their target
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          $RUN wasm-check cargo check --target wasm32-unknown-unknown -p skein-lib -p skein-codec -p skein-http
          $RUN wasm-clippy cargo clippy --target wasm32-unknown-unknown -p skein-ui -p skein-ui-web \
              -p skein-ui-example-view -p skein-ui-example-shell-web -- -D warnings

      - name: The TLS machine on its own
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN tls cargo check -p skein-tls

      - name: Build the tests
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN build-tests cargo nextest run --workspace --no-run

      - name: Save the registry
        if: always()
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: cargo-home-macos-26-${{ hashFiles('Cargo.lock') }}
        continue-on-error: true
      - name: Save the target
        if: always() && steps.target.outputs.cache-hit != 'true'
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5.1.0
        with:
          path: target
          key: target-macos-26-rust-${{ env.RUST_VERSION }}-${{ hashFiles('Cargo.lock') }}
        continue-on-error: true

      - name: The focused suite
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN default cargo nextest run --workspace --no-fail-fast

      - name: The fuzzy suite
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: $RUN fuzzy cargo nextest run --workspace --profile fuzzy --no-fail-fast

      # The browser tier uses a dev-profile module under the server's strict policy.
      - name: The bundle
        if: ${{ !cancelled() && steps.rust.outcome == 'success' }}
        run: |
          $RUN wasm-build cargo build --target wasm32-unknown-unknown -p skein-ui-example-shell-web
          $RUN bundle cargo run -p skein-ui-bundle -- \
              --module target/wasm32-unknown-unknown/debug/skein_ui_example_shell_web.wasm \
              --name skein_ui_example_shell_web --prefix /bundle/ --stylesheet examples/ui/shell-web/notes.css --out target/ui-example-bundle \
              --noscript 'Notes needs WebAssembly and scripts.'
          $RUN server cargo build -p skein-ui-example-server

      - name: The browser tier
        if: ${{ !cancelled() && steps.rust.outcome == 'success' && steps.chrome.outcome == 'success' && steps.fonts.outcome == 'success' }}
        run: |
          export SKEIN_UI_EXAMPLE_BUNDLE="$PWD/target/ui-example-bundle"
          $RUN browser cargo nextest run --workspace --profile browser --no-fail-fast

      - name: The disk
        if: always()
        run: |
          echo "::notice title=disk::$(df -h / | tail -1 | tr -s ' ')"
          echo "::notice title=target::$(du -sh target 2>/dev/null | cut -f1)"
