[package]
name = "skein-throwaway-forgejo"
description = "An isolated Forgejo instance for protocol transcripts and process tests"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
[dependencies]
skein-forge.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-http.workspace = true
skein-json.workspace = true
skein-shell.workspace = true
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"

[[bin]]
name = "attached-peer"
path = "tests/support/attached.rs"
test = false
