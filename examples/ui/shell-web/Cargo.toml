[package]
name = "skein-ui-example-shell-web"
description = "The reference browser shell for the notes example"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
skein-ui-example-view.workspace = true
skein-ui.workspace = true
skein-lib.workspace = true
skein-ui-web.workspace = true
wasm-bindgen.workspace = true
web-sys = { workspace = true, features = ["Window", "Document", "Location", "HtmlElement", "HtmlTextAreaElement", "InputEvent", "Event"] }

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
