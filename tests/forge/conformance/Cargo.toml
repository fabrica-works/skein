[package]
name = "forgejo-conformance"
description = "Plain HTTP transcripts from the throwaway Forgejo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
[dependencies]
skein-json.workspace = true
skein-forge.workspace = true
skein-throwaway-forgejo.workspace = true
skein-forge-connection.workspace = true
skein-forge-client.workspace = true
skein-shell.workspace = true
skein-io.workspace = true
skein-lib.workspace = true
skein-tls.workspace = true
[lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "deny"
unused_must_use = "deny"
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
missing_panics_doc = "allow"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
unwrap_used = "deny"
allow_attributes = "deny"
allow_attributes_without_reason = "deny"
disallowed_types = "deny"
disallowed_methods = "deny"
